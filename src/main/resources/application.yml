spring:
  profiles:
    active: local  # 기본값, 서버 배포 시 prod로 교체
  jackson:
    property-naming-strategy: SNAKE_CASE
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Neon에서 직접 만들었으니까
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    com.example.mydocsbe.auth: DEBUG

jwt:
  secret: ${JWT_SECRET:7U9wb1goX0f24PVR7eid394FGk0v+VHlqUFP8ydJwrM=}
  expiration: 86400000  # 24시간 (ms)

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}